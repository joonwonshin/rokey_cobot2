# 무엇을 보고 무엇을 집을지 — **이 파일 하나가 정본이다.**
#
# 왜 여기(ws 루트)에 있나:
#   1. 재빌드가 필요 없다. 패키지 안(`src/*/config/`)에 두면 `--symlink-install` 이어도
#      share 가 `build/` 를 가리켜서(CLAUDE.md §4) 고쳐도 안 먹고, "왜 안 바뀌지"를 쫓게 된다.
#      여기 있으면 고치고 다시 띄우기만 하면 된다.
#   2. 컨테이너가 ws 를 **같은 절대경로**(/home/kimkh/cobot2_ws)로 마운트한다 —
#      호스트의 grasp_bridge_node 와 컨테이너의 yolo_seg_node 가 같은 파일을 본다.
#
# 누가 읽나:
#   - `yolo_seg_node`  : `detect` → COCO 인덱스로 변환해 **탐지 대상**을 좁힌다
#                        (변환은 가중치의 model.names 로 한다 — 인덱스를 손으로 안 적는다)
#   - `pick_fsm.launch.py` : `pick_default` → task_manager 의 초기 `target`
#                        (런타임에는 rqt 패널/`/pick/target` 이 이깁니다)
#   - `graspx.launch.py`   : `dimensions` → grasp_bridge_node 의 `class_dims`
#                        (yolo 세그의 물체별 반경/높이 크롭 — 아래 절 참고)
#
# 고친 뒤: 노드를 다시 띄운다. `ros2 param set` 으로는 안 바뀐다
#          (yolo_seg_node 는 __init__ 에서 한 번만 읽는다).

# ── 탐지 대상 (넓게) ─────────────────────────────────────
# YOLO 가 아예 안 찾는 물체는 어떤 방법으로도 못 잡는다. 작업대에 다른 물체가 많으면
# 여기를 좁게 유지하는 게 맞다 — 노이즈를 물체로 오인하는 사고를 줄인다.
#
# ⚠️ **이름으로 적는다. COCO 인덱스가 아니다.** 대소문자를 구분한다.
#    여기 없는 이름을 적으면 노드가 기동 즉시 죽는다(가중치가 아는 이름을 같이 찍어준다) —
#    조용히 무시하면 "사과를 왜 못 잡지"를 며칠 쫓게 된다.
# ⚠️ 현재 가중치 `yolo11n-seg.pt` 는 **COCO 80종만** 안다. 이 프로젝트의 공구 5종은
#    어떤 이름으로도 못 잡는다 — 파인튜닝 전까지 남는 한계다(md/state.md 0-b).
# 2026-08-09: 옛 `classes:='[39,41,44,46,47,49,64]'` 와 같은 7종이다.
# 대응하는 인덱스를 여기 적어 두지 않는다 — 그게 위 ⚠️ 가 말하는 드리프트의 씨앗이다.
# 실제로 무엇으로 변환됐는지는 yolo_seg_node 가 기동할 때 로그로 찍는다:
#   탐지 대상 [...] -> COCO [...]  (출처: .../config/objects.yaml)
detect:
  - bottle
  - cup
  - spoon
  - banana
  - apple
  - orange
  - mouse

# ── 기본 pick 타겟 ───────────────────────────────────────
# 비우면 자동: 위 detect 로 탐지된 것 전부 중 grasp 점수가 가장 높은 것을 잡는다.
# 하나로 못 박으려면 이름을 적는다(예: apple). 콤마로 여러 개도 된다(예: apple,orange).
# ⚠️ 반드시 위 detect 안에 있는 이름이어야 한다. 밖의 이름을 적으면 YOLO 가 애초에
#    그걸 안 찾으므로 "해당하는 물체가 없다" 로 실패한다.
# 런타임에는 rqt 패널의 타겟 상자 / `/pick/target` 이 이 값을 덮어쓴다.
pick_default: ''

# ── 클래스별 실측 치수 (선택, 2026-08-09) ─────────────────
# seg_source=yolo 전용. 여기 있는 클래스는 grasp_bridge_node 의 전역 obj_radius_m(반경
# 크롭)·obj_max_h(상한 없음이 기본) 대신 **이 실측치**를 물체별로 쓴다 — 노이즈 낀 depth
# 에서도 마스크를 이 크기로 고정해 정확도를 올린다. 상세는 src/PACKAGES.md#graspgenx_perception.
#
# ⚠️ 기본은 **형태가 고정된 공산품만** 적는 것이다 (콜라병·머그컵 등) — 개체마다 형태가
#    다른 자연물(사과·바나나 등)은 대표값 하나로 못 잡는 게 원칙이다. 여기 안 적으면
#    기존 동작(전역 반경, 상한 없음) 그대로다. 안 적는 게 기본이고 안전하다.
#    예외: apple/orange 는 2026-08-10 실측(자로 측정)해서 개체 편차가 허용 범위 안임을
#    확인한 뒤 등록했다 — 다른 자연물을 추가할 때도 실측 없이 대표값을 넣지 않는다.
# radius·height 단위는 **미터**. radius 는 물체를 위에서 봤을 때의 대략적 반경(원기둥
# 근사), height 는 테이블면 위로 올라온 실제 높이(돌출 높이)다 — 자로 재거나 라이다
# 스캔(예: 아이폰) 결과에서 뽑는다.
# 비워 두면(기본) 아무 클래스도 실측치를 안 쓴다.
dimensions:
  bottle: {radius: 0.03, height: 0.228}
  apple:  {radius: 0.035, height: 0.06}
  orange: {radius: 0.035, height: 0.05}
