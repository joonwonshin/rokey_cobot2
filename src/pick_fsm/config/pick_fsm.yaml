# task_manager 파라미터. 값의 정본은 이 파일이다 — 런치/alias 에 숫자를 하드코딩하지 않는다.
#
# ⚠️ 아래 값 중 **실측으로 확정되지 않은 것**에는 UNVERIFIED 를 붙였다. 지우지 말 것.
task_manager:
  ros__parameters:

    # ── 안전 ─────────────────────────────────────────────
    # ⚠️ dry_run(plan_only) 은 2026-08-09 제거했다. 이 FSM 은 항상 실제로 움직인다.
    # 🔴 2026-08-11 사용자 결정으로 승인 게이트를 껐다(false). 지금 실기 안전장치는
    #    물리 비상정지 버튼 하나뿐이다. launch 도 기본 false 로 맞춰 뒀다(pick_fsm.launch.py
    #    가 이 yaml 을 덮으므로 둘 다 false 여야 실제로 꺼진다). 다시 켜려면 둘 다 true.
    require_approval: false     # false = /pick/approve 없이 곧장 실행
    approval_timeout_sec: 300.0
    # place 미지정 pick 이 WAIT_PLACE_TARGET 에서 기다리는 동안의 **자동 내려놓기**.
    # 🔴 0.0 = 끔(기본). 2026-08-12 사용자 결정으로 2026-08-11 의 "60s 뒤 basket 자동
    #    내려놓기"를 없앴다 — 시간이 지나서 팔이 저절로 움직이는 경로는 두지 않는다.
    #    사람이 set_place(놓을 곳 지정) 또는 release_now(그 자리에 놓기)를 말할 때까지
    #    문 채로 기다린다. 무기한 보유의 부담은 알고 받아들인 것이고, 안전장치는 물리
    #    비상정지 버튼과 cmd:"stow"(정리 후 종료)다.
    #    옛 동작이 필요하면 여기에 초 단위 양수를 넣으면 그대로 돌아온다.
    wait_place_timeout_sec: 0.0
    # eye-in-hand 재파지 (스캐폴드, 2026-08-11). true 면 pre-grasp 도착 후 REGRASP 를 거쳐
    # 손목 카메라로 재-graspgenx + 사람 승인. 🔴 카메라·hand-eye 캘리브 미장착이라 실제
    # 재계산은 미구현(_st_regrasp HOOK). 기본 false = 지금 흐름 그대로.
    regrasp_enabled: false
    regrasp_timeout_sec: 300.0

    # ── 손목 eye-in-hand 예약 (미구현 — 2026-08-12) ────────
    # 🔴 **전부 주석이다.** 켜지 마라 — 받을 노드가 없다. 이름을 지금 못박아 두는
    #    이유는, 나중에 급하게 붙일 때 이름이 갈리면 launch·yaml·코드가 서로 다른
    #    키를 보게 되고 그건 조용히 안 먹는 종류의 고장이기 때문이다.
    #
    #    붙일 때 고칠 곳 7군데는 인계문서 §P6(계획 §7-3 표)에 있다.
    #    가장 먼저 확인할 것: 손목 코드는 `PERCEIVE`에서 Top grasp 를 얻고
    #    `PLAN`이 3점 IK 를 전부 통과해야 도달한다 — 병목은 REGRASP 가 아니다.
    #
    # wrist_camera_ns: /wrist_camera        # 그때 Top 은 /top_camera 로 개명한다
    # wrist_grasp_service: /grasp/compute_grasp_wrist
    # observation_offset_m: 0.20            # 손목이 물체를 보는 거리
    # max_active_views: 3                   # 관측 자세 재시도 상한

    # ── MoveIt ───────────────────────────────────────────
    planning_group: manipulator
    # 🔴 tool0 이 아니다 (2026-08-07 정정). tool0 의 접근축은 +Z 가 아니라 +X 라서
    #    (`onrobot_rg2.xacro:40` rpy="1.5708 0 1.5708") grasp 포즈를 tool0 에 그대로 걸면
    #    그리퍼가 90° 누운 채 계획된다. 실기 확인: 같은 하강 포즈로 /compute_ik 를 부르면
    #    ik_link=rg2_base_link 는 SUCCESS, ik_link=tool0 는 NO_IK_SOLUTION(-31) 이다.
    #    rg2_base_link 는 GraspGenX 그리퍼 base 와 같은 프레임이라 브라켓 22 mm 도 같이 해소된다.
    ee_link: rg2_base_link
    base_frame: base_link       # ⚠️ world 아님 (planning scene 은 world 를 모른다)
    joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    vel_scale: 0.05              # 실기 첫 시도는 느리게. 익숙해지면 올린다
    acc_scale: 0.05
    planning_time: 10.0
    planning_attempts: 20
    joint_tolerance: 0.001
    ik_timeout_sec: 0.2
    ik_avoid_collisions: true   # false 로 두면 도달성만 따로 볼 수 있다(디버깅용)
    planning_pipeline: ompl     # ompl | isaac_ros_cumotion (scripts/bench_planning_time.py 와 같은 이름)
    planner_id: ''              # 비우면 파이프라인 기본 플래너
    replan: true
    replan_attempts: 3
    replan_delay: 1.0           # ⚠️ 반드시 소수점을 붙인다. `1` 이면 YAML 이 INTEGER 로 읽어
                                #    declare_parameter 기본값(DOUBLE)과 타입이 달라 노드가 죽는다
    motion_retries: 2

    # ── 자세 ─────────────────────────────────────────────
    approach_offset_m: 0.10     # UNVERIFIED: 접근 여유. 물체 주변 혼잡도에 따라 조정
    # 하강 종점(그리퍼를 오므리기 시작하는 지점)을 grasp 의 -Z(접근축)로 이만큼 덜 내린다.
    # LIFT 도 이 종점 기준으로 올라간다 (grasp 원점 기준이면 물체를 문 채 도로 밀고 들어간다).
    # ⚠️ 월드 +Z(수직 위)가 아니라 접근축이다 — 비스듬한 grasp 에서는 하강 직선 위로 뺀다.
    # ⚠️ 끄려면 `0` 이 아니라 **`0.0`** 이라고 쓴다 (위 replan_delay 와 같은 INTEGER 함정).
    #    부호는 무시되고(항상 후퇴), approach_offset_m 을 넘으면 거기서 클램프된다.
    # UNVERIFIED: 2026-08-08 실기에서 "그립 시도지점이 물체에 너무 붙는다"는 관찰로 넣은 값.
    # 근본 원인은 미확인 — GraspGenX 는 자기 모델 손끝(`config.json` fingertip[2] = 0.18 m)
    # 기준으로 grasp 원점을 잡는데, 이 그리퍼의 실측 손끝은 `rg2_base_link` 기준 0.218 m
    # (닫힘) ~ 0.177 m (개구 100 mm) 로 **폭에 따라 41 mm 움직인다**(rg2.py 가 정본).
    # 그 차이가 원인이라면 이 값은 상수일 수 없다. 폭이 다른 물체에서 다시 재볼 것.
    grasp_standoff_m: 0.03
    lift_offset_m: 0.15         # UNVERIFIED
    # tcp_offset_m 파라미터는 삭제됨(2026-08-07) — rg2.fingertip_length_m(width_m)이
    # 실측 보정표(닫힘 0.240 m, 폭에 따라 비선형 감소)로 대체했다. pick_fsm/rg2.py 가 정본.
    max_reach_m: 1.0        # ⚠️ `1` 로 쓰면 INTEGER 로 읽혀 노드가 죽는다 (replan_delay 와 같은 함정)
                            # M0609 URDF 실측 (shoulder 기준 flange 까지)
                            # ⚠️ 코드 기본값은 0.900 이다. 여기서 1.0 으로 넓혀 놓은 것이므로
                            #    "실측 0.9 인데 왜 1.0?" 이라면 이 값을 확인할 것
    # ⚠️ 아래 둘은 robot_control.py 의 JReady/BUCKET_POS 와 값이 다르다. 실기에서 다시 잡은
    #    값으로 보이므로 "원본과 맞춰야 한다"며 되돌리지 말 것. (원본: JReady [0,0,90,0,90,0],
    #    BUCKET_POS [4,38,64,-0.1,78,4])
    # 2026-08-08: joint_5 가 400.0 → 40.0 (오타. 400° 는 M0609 가동범위 밖이라 movej/IK 실패)
    home_joints_deg: [0.0, 0.0, 40.0, 0.0, 40.0, 0.0]
    place_joints_deg: [77.0, 4.0, 80.0, 0.0, 62.0, 0.0]   # 'basket' — 실기 teach 값(위 참고)
    # 2026-08-11: 실기 teach 완료(펜던트 값 입력). 아직 pick_fsm 통합 테스트는 미검증.
    place_table_joints_deg: [-130.07, -1.77, 119.41, 0.0, 62.36, 68.8]
    place_discard_joints_deg: [37.0, 42.0, 47.0, 180.0, -92.0, 40.0]
    place_location: basket   # basket(장바구니) | table(작업테이블 지정 자리) | discard(테이블 밖 폐기)
                              # 런타임엔 /pick/place_location(rqt 패널)이 이 값을 이긴다

    # ── 씬 ───────────────────────────────────────────────
    object_id: pick_target
    object_radius_m: 0.04       # UNVERIFIED: 대상 근사 구 반지름. 사과 기준 대충
    # 아래 둘은 **켤 때 무엇을 포기하는지 알고 켜야 한다.** README "SCENE_PREP" 절 참고
    clear_octomap_before_descend: false
    # 2026-08-11 실기 확인: table/discard place 자세가 PICK 때 찍힌 옥토맵(테이블 표면)과
    # 겹쳐 RRTConnect가 goal state를 못 잡고 FAILURE(99999) — move_group 로그로 원인 확정
    # (`<octomap>` vs `rg2_base_link` contact). place 직전엔 옥토맵을 비운다.
    clear_octomap_before_place: true
    allow_gripper_octomap_collision: false
    gripper_links:
      - rg2_base_link
      - rg2_left_outer_knuckle
      - rg2_left_inner_knuckle
      - rg2_left_inner_finger
      - rg2_right_outer_knuckle
      - rg2_right_inner_knuckle
      - rg2_right_inner_finger

    # ── 그리퍼 ───────────────────────────────────────────
    gripper_backend: real       # real | virtual. 숫자 명령의 의미가 서로 다르다
    gripper_service: /onrobot/sendCommand
    grip_detected_topic: /onrobot/grip_detected
    # 물체 폭에서 **빼는** 조임 여유. 목표 개구 = 물체 폭 - 이 값.
    # 더하면 손가락이 물체에 닿기 전에 멈춘다(2026-08-09 부호 수정).
    grip_clearance_m: 0.008     # UNVERIFIED: 도면값 아님. 실측 튜닝 필요
    max_grip_width_m: 0.102     # GraspGenX sweep_volume 기준(하드웨어 0.110보다 좁은 쪽)
    force_down_steps: 0         # 'd' 반복 횟수. 0이면 드라이버 기본 = 40 N (RG2 최대!)
    gripper_settle_sec: 1.5     # UNVERIFIED
    verify_required: false      # grip_detected 를 못 받아도 진행 (가상 그리퍼 대응)
    grip_retries: 1
    # 파지 실패 시 놓고 재인식(grip_retries)하기 전에, 같은 자세에서 이만큼씩 좁혀
    # 다시 닫아보는 횟수. 병처럼 기입된 width_m(=최대 단면)보다 얇은 부위(목)를
    # 노렸을 때 손가락이 접촉 전에 멈춰 "실패"로 오판되는 경우를 구제한다.
    grip_narrow_retries: 1
    grip_narrow_step_m: 0.015   # UNVERIFIED: 실측 튜닝값

    # ── 인식 ─────────────────────────────────────────────
    # /grasp/compute_grasp 서버는 2026-08-09 에 grasp_bridge_node 에 생겼다.
    # 🔴 **물체별 폭은 compute_grasp 경로로만 온다.** legacy_trigger(std_srvs/Trigger)는
    #    응답에 폭 필드가 없어 아래 default_width_m 상수로 전부 때운다 — 물체가 뭐든 같은 폭.
    #    폭을 쓰려면 compute_grasp 로 바꾼다. 단 **실기 미검증**이다(폭 측정·조임 부호 신규).
    grasp_source: legacy_trigger  # legacy_trigger | compute_grasp | manual
    grasp_service: /grasp/compute_grasp
    grasp_trigger_service: /grasp/compute
    grasp_best_topic: /grasp/best
    grasp_candidates_topic: /grasp/candidates
    min_confidence: 0.2
    default_width_m: 0.06       # UNVERIFIED: legacy/manual 경로 전용 임시 폭
    max_alternatives: 5

    # ── 인식 브리지 푸시 ─────────────────────────────────
    # 타겟의 정본은 이 FSM 이다. PERCEIVE 진입 때 아래 노드의 target_classes(+seg_source)로
    # 밀어 넣는다 — 안 그러면 브리지에 남은 이전 값과 어긋난 채 조용히 돈다(2026-08-09 실기).
    bridge_node: /grasp_bridge_node   # 비우면('') 푸시하지 않는다 — 브리지를 직접 설정할 때
    bridge_seg_source: yolo     # 이 ws 의 기본 파이프라인. geometric 은 클래스를 몰라
                                # target 을 못 쓴다. ''(빈 문자열)이면 브리지 설정을 안 건드림

    # ── 음성 ─────────────────────────────────────────────
    voice_enabled: true
    keyword_service: /get_keyword
    # voice_enabled=false 일 때의 **초기** 타겟. 콤마로 여러 개('apple,orange'), 비우면
    # 자동(브리지가 본 것 전부에서 점수 최고). 런타임에는 /pick/target 이 이 값을 덮는다.
    target: ''

    tick_hz: 10.0
